<!DOCTYPE html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // 🌓 描画前にテーマを確定させ、ちらつきを防止する（item/index.html等と同一ロジック）
    (function () {
      try {
        var saved = localStorage.getItem('sky_app_theme');
        var isDark = (saved === 'light' || saved === 'dark') ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
    // 🎨 着せ替え(js/theme.js)で保存済みの配色を、描画前に先に差し込む。これが無いと、
    // 起動のたびに標準の配色が一瞬見えてから着せ替えに切り替わってしまう。
    // キャッシュはjs/theme.jsが生成したCSSだけ（url()・@import・タグ終端を含まない）。
    // 外部から取り込んだバックアップで書き換えられていても外部通信を起こさないよう、
    // 念のため確認してから使う。
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('sky_hub_theme_css_v1'));
        if (!c || typeof c !== 'object') return;
        var html = document.documentElement;
        var scheme = (c.fixed === 'light' || c.fixed === 'dark') ? c.fixed : html.getAttribute('data-theme');
        var css = c[scheme];
        if (typeof css !== 'string' || /url\s*\(|@import|<\/style|<script/i.test(css)) return;
        html.setAttribute('data-theme', scheme);
        var st = document.createElement('style');
        st.id = 'hub-theme-style';
        st.textContent = css;
        document.head.appendChild(st);
        html.setAttribute('data-hub-theme', 'on');
        html.setAttribute('data-hub-card', c.card === 'flat' || c.card === 'glass' ? c.card : 'soft');
        if (typeof c.font === 'string' && c.font.indexOf('https://fonts.googleapis.com/') === 0) {
          var l = document.createElement('link');
          l.id = 'hub-theme-font'; l.rel = 'stylesheet'; l.href = c.font;
          document.head.appendChild(l);
        }
      } catch (e) { /* キャッシュが無い・壊れている場合は標準の配色のまま */ }
    })();
  </script>
  <script>
    // 🪟 ワイド画面のサイドパネル（関連ツール＝左端／ダッシュボード＝右端。css/chrome.css）を使う設定なら、
    // 描画前にレイアウト用のクラスを付ける。JSの起動後に付けると本文が左右にずれて画面がガクつくため。
    // 実際に出るのは幅1280px以上の時だけ（CSS側のメディアクエリ）。設定はjs/state.jsのgetSidePanelEnabled()と同じキー
    // （左=sky_side_tools／右=sky_side_dash。未設定＝オン。旧キーsky_hub_side_panelsが'0'ならそれを引き継ぐ）。
    (function () {
      var c = document.documentElement.classList;
      try {
        var legacy = localStorage.getItem('sky_hub_side_panels');
        var t = localStorage.getItem('sky_side_tools'), d = localStorage.getItem('sky_side_dash');
        if ((t === null ? legacy : t) !== '0') c.add('side-panels-on');
        if ((d === null ? legacy : d) !== '0') c.add('side-dash-on');
      } catch (e) { c.add('side-panels-on'); c.add('side-dash-on'); }
    })();
  </script>

  <!-- 🩹 js/app.js（ビルドツールなしのネイティブES Modules）は静的importの
       依存グラフ全体（state.js/icon-sprite.js/router.js/shortcuts.js/
       site-dock.js…）を取得・解決してからでないと1行も実行されない。
       この間#app-rootへの書き込みは一切発生しないため、#app-rootを空の
       まま出すと「一瞬だけ素の状態（背景色だけで中身が無い画面）」が
       見えてしまう。router-registry.jsがルート切替時に使うのと全く同じ
       .rt-loadingスピナーを最初からここに静的に書いておくことで、JSの
       起動を待たずに最初の描画から常に何か（スピナー）が見えている状態
       にする——router.jsのapplyRoute()がappRoot.innerHTML=''で
       上書きするため、実際のコンテンツに置き換わる際の追加対応は不要。 -->
  <link rel="modulepreload" href="js/app.js">

  <link rel="modulepreload" href="js/theme.js">
